services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cafe_user
      POSTGRES_PASSWORD: cafe_pass
      POSTGRES_DB: cafe_erp
    ports:
      - "5432:5432"
    volumes:
      - cafe_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe_user -d cafe_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      USE_SQLITE: "false"
      DATABASE_URL: postgresql://cafe_user:cafe_pass@db:5432/cafe_erp
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173","http://frontend:5173"]'
      JWT_SECRET_KEY: change-me-in-production-cafe-erp-secret-key
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  cafe_pg_data:
